<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOEIC Prep – Ôn thi TOEIC</title>
  <meta name="description" content="Web app ôn thi TOEIC: luyện tập chấm ngay có giải thích, hoặc thi thử chấm điểm cuối bài.">
  <style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #1d2433;
  --muted: #667085;
  --line: #e3e7ef;
  --primary: #2f6fed;
  --primary-soft: #e8f0ff;
  --ok: #12a150;
  --ok-soft: #e6f7ee;
  --bad: #e5484d;
  --bad-soft: #fdecec;
  --warn: #f5a524;
  --shadow: 0 2px 10px rgba(20, 30, 60, .06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f141e; --card: #171e2b; --text: #e7ebf3; --muted: #98a2b3; --line: #2a3446;
    --primary: #5b8cff; --primary-soft: #1d2b4a; --ok: #3ccf7f; --ok-soft: #13301f;
    --bad: #ff6b70; --bad-soft: #3a1b1d; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.55; font-size: 16px;
}
a { color: var(--primary); }
button { font: inherit; cursor: pointer; }

.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 800; font-size: 20px; text-decoration: none; color: var(--text); }
.brand span { color: var(--primary); }
.topbar nav { display: flex; gap: 6px; flex-wrap: wrap; }
.topbar nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 14px; }
.topbar nav a:hover { background: var(--primary-soft); color: var(--primary); }
.badge { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; }

main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
.foot { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 16px 30px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
h1 { font-size: 26px; margin: 4px 0 6px; }
h2 { font-size: 19px; margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* Home */
.hero p { margin: 0; color: var(--muted); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .modes { grid-template-columns: 1fr; } }
.mode {
  text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--text);
  border-radius: var(--radius); padding: 16px; transition: .15s;
}
.mode:hover { border-color: var(--primary); }
.mode.active { border-color: var(--primary); background: var(--primary-soft); }
.mode .ico { font-size: 28px; }
.mode b { display: block; font-size: 17px; margin: 4px 0; }
.mode span { color: var(--muted); font-size: 14px; }

.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.part-opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.part-opt:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.part-opt input { margin-top: 4px; }
.part-opt b { display: block; font-size: 15px; }
.part-opt small { color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); font-weight: 600; }
select, input[type=number] {
  font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text);
}
.check { flex-direction: row !important; align-items: center; gap: 8px !important; color: var(--text) !important; }

.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 9px 16px; border-radius: 10px; font-weight: 600; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; }
.btn.big { padding: 12px 22px; font-size: 17px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
.chip:hover { border-color: var(--primary); color: var(--primary); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--bg); border-radius: 10px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 24px; }
.stat span { font-size: 13px; color: var(--muted); }

/* Quiz */
.quizbar {
  position: sticky; top: 53px; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.progress { flex: 1; min-width: 160px; }
.progress .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.progress .bar i { display: block; height: 100%; background: var(--primary); transition: width .2s; }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; padding: 4px 10px; border-radius: 8px; background: var(--primary-soft); color: var(--primary); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); }
.tag.exam { background: #fff1db; color: #a15c00; }
@media (prefers-color-scheme: dark) { .tag.exam { background: #3a2a10; color: #ffbe55; } }

.instr { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
.passage { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; max-height: 420px; overflow: auto; }
.passage p { margin: 0 0 10px; }
.scene { text-align: center; background: var(--bg); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
.scene .icon { font-size: 54px; letter-spacing: 4px; }
.scene .desc { color: var(--muted); font-size: 14px; margin-top: 6px; }
.audio { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.transcript { background: var(--bg); border-left: 4px solid var(--primary); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 15px; }
.transcript p { margin: 3px 0; }

.q { padding: 12px 0; border-top: 1px dashed var(--line); }
.q:first-of-type { border-top: 0; }
.qtext { font-weight: 600; margin-bottom: 10px; white-space: pre-line; }
.qnum { display: inline-block; min-width: 34px; color: var(--primary); }
.opts { display: grid; gap: 8px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
  border: 1.5px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 10px 12px; transition: .1s;
}
.opt:hover:not(:disabled) { border-color: var(--primary); }
.opt .L { font-weight: 800; min-width: 22px; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.explain { margin-top: 10px; border-radius: 10px; padding: 10px 14px; font-size: 15px; }
.explain.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
.explain.bad { background: var(--bad-soft); border: 1px solid var(--bad); }
.explain b { display: block; margin-bottom: 2px; }

.navrow { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.palette button { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-weight: 700; font-size: 13px; }
.palette button.done { background: var(--primary); color: #fff; border-color: var(--primary); }
.palette button.cur { outline: 2px solid var(--warn); outline-offset: 1px; }
.palette button.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
.palette button.bad { background: var(--bad); color: #fff; border-color: var(--bad); }

/* Result */
.score-big { font-size: 46px; font-weight: 900; line-height: 1; }
.scorebox { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; }
.ring { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; }
.ring div { width: 94px; height: 94px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-weight: 900; font-size: 24px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
.review-item { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.review-item.bad { border-left: 5px solid var(--bad); }
.review-item.ok { border-left: 5px solid var(--ok); }
.review-item.skip { border-left: 5px solid var(--warn); }
details summary { cursor: pointer; color: var(--primary); font-weight: 600; font-size: 14px; }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-nav="home">📘 TOEIC <span>Prep</span></a>
    <nav>
      <a href="#" data-nav="home">Trang chủ</a>
      <a href="#" data-nav="wrong">Câu sai <span id="wrongCount" class="badge">0</span></a>
      <a href="#" data-nav="history">Lịch sử</a>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="foot">
    Câu hỏi được biên soạn theo format & chủ điểm đề TOEIC những năm gần đây (format mới 2019+).
    Không phải đề gốc của ETS. Phần nghe dùng giọng đọc tổng hợp của trình duyệt.
  </footer>

  <script>
/*
 * Ngân hàng câu hỏi LISTENING (Part 1, 2, 3, 4)
 * Âm thanh được phát bằng Web Speech API (giọng đọc tổng hợp của trình duyệt).
 * script: mảng các lượt nói {s: 'M'|'W'|'N', t: 'text'}  (M = nam, W = nữ, N = người dẫn)
 * Với Part 1: scene = mô tả bức tranh (hiển thị bằng emoji + chữ), các lựa chọn được đọc to.
 * Với Part 2: câu hỏi + 3 lựa chọn đều được đọc, không hiển thị chữ cho tới khi trả lời.
 */
window.BANK = window.BANK || [];

/* ============================ PART 1 ============================ */
(function () {
  const P1 = [
    ["👩‍💼💻🪟", "Một người phụ nữ đang ngồi gõ máy tính xách tay cạnh cửa sổ.",
      ["She's opening a window.", "She's typing on a laptop.", "She's repairing a computer.", "She's putting on her glasses."], 1,
      "Mô tả đúng hành động đang diễn ra: đang gõ máy tính. Bẫy: 'window' (có trong tranh nhưng không mở), 'computer' (không sửa)."],
    ["📦📦📦🧑‍🔧🚚", "Một công nhân đang chất các thùng hàng lên xe tải.",
      ["A man is driving a truck.", "Some boxes are being loaded onto a vehicle.", "A truck is parked in a garage.", "Some boxes are being opened."], 1,
      "Bị động tiếp diễn 'are being loaded' = đang được chất lên. Người đàn ông không lái xe; hộp không được mở."],
    ["🪑🪑🪑🍽️ (trống)", "Một nhà hàng trống không có ai, ghế được xếp quanh bàn.",
      ["Some people are eating a meal.", "A waiter is setting a table.", "Chairs have been arranged around a table.", "The tables are being cleaned."], 2,
      "Tranh không có người → loại các câu có người hoặc hành động đang diễn ra ('being'). 'have been arranged' = đã được sắp xếp (trạng thái)."],
    ["🧑‍🤝‍🧑🚶‍♂️🌉", "Hai người đang đi bộ qua một cây cầu.",
      ["They're crossing a bridge.", "They're fishing in a river.", "They're painting a bridge.", "They're waiting for a boat."], 0,
      "'crossing a bridge' = đi qua cầu. Các hành động khác không có trong tranh."],
    ["📚📚🗄️ (kệ sách)", "Các cuốn sách được xếp trên kệ trong thư viện, không có người.",
      ["A woman is reading a book.", "Books have been placed on shelves.", "Some shelves are being installed.", "Some books are lying on the floor."], 1,
      "Không có người, sách đã được đặt lên kệ → 'have been placed on shelves'."],
    ["👨‍🍳🥕🔪", "Một đầu bếp đang thái rau trên thớt.",
      ["A chef is cutting some vegetables.", "A chef is washing the dishes.", "Some vegetables are being cooked in a pot.", "A man is serving food to customers."], 0,
      "Đang thái rau → 'cutting some vegetables'."]
  ];
  P1.forEach((x, i) => window.BANK.push({
    id: "p1-" + (i + 1), part: 1, scene: { icon: x[0], desc: x[1] },
    script: [],
    questions: [{ q: "Chọn câu mô tả đúng nhất bức tranh.", o: x[2], a: x[3], e: x[4], audioOptions: true }]
  }));
})();

/* ============================ PART 2 ============================ */
(function () {
  const P2 = [
    ["Where is the nearest post office?", ["It's two blocks from here.", "At three o'clock.", "Yes, I sent it yesterday."], 0,
      "Câu hỏi 'Where' → trả lời địa điểm. (B) trả lời 'When'; (C) trả lời Yes/No không hợp với câu hỏi Wh-."],
    ["When does the meeting start?", ["In the conference room.", "Right after lunch.", "Mr. Brown will lead it."], 1,
      "Câu hỏi 'When' → thời gian: 'Right after lunch'. (A) Where; (C) Who."],
    ["Who's in charge of the new project?", ["It's due next Friday.", "Ms. Lee is.", "A very interesting project."], 1,
      "Câu hỏi 'Who' → người: 'Ms. Lee is'. (C) lặp từ 'project' – bẫy âm giống."],
    ["Why was the flight delayed?", ["Because of bad weather.", "Gate 12.", "About two hours."], 0,
      "Câu hỏi 'Why' → lý do: 'Because of bad weather'. (C) trả lời 'How long'."],
    ["How often do you visit the main office?", ["By train.", "Once a month.", "For three days."], 1,
      "'How often' → tần suất: 'Once a month'. (A) How; (C) How long."],
    ["Would you like some coffee?", ["Yes, I'd love some.", "It's in the kitchen.", "I like it very much."], 0,
      "Lời mời 'Would you like...?' → chấp nhận/từ chối: 'Yes, I'd love some'."],
    ["Didn't you receive my e-mail?", ["The mail carrier came at noon.", "No, I haven't checked my inbox yet.", "I'll send it to you."], 1,
      "Câu hỏi phủ định → trả lời như câu hỏi thường: 'No, I haven't checked...'. (A) bẫy từ 'mail'."],
    ["Should we take a taxi or walk to the restaurant?", ["Yes, I took one.", "It's close enough to walk.", "The food was great."], 1,
      "Câu hỏi lựa chọn (A or B) → chọn một: 'close enough to walk'. Câu hỏi lựa chọn không trả lời Yes/No."],
    ["Can you help me move these boxes?", ["Sure, where should I put them?", "They're from the supplier.", "I moved last year."], 0,
      "Lời nhờ 'Can you...?' → đồng ý 'Sure' + hỏi tiếp. (C) bẫy từ 'move'."],
    ["The printer on the third floor is out of order.", ["I'll call the technician.", "Three copies, please.", "In alphabetical order."], 0,
      "Câu trần thuật nêu vấn đề → phản hồi giải pháp: 'I'll call the technician'. (C) bẫy từ 'order'."],
    ["Which hotel are you staying at?", ["For two nights.", "The one near the convention center.", "Yes, it was comfortable."], 1,
      "'Which hotel' → 'The one near the convention center' (cấu trúc 'the one' rất hay gặp)."],
    ["Who's going to pick up the clients from the airport?", ["I thought Kevin was.", "At terminal B.", "They're very important clients."], 0,
      "Trả lời gián tiếp 'I thought Kevin was' (tôi tưởng Kevin đi) – dạng trả lời vòng phổ biến trong đề mới."],
    ["How much does it cost to rent a car?", ["About fifty dollars a day.", "A red one.", "At the rental counter."], 0,
      "'How much' → giá tiền."],
    ["Isn't the store open on Sundays?", ["Only in the afternoon.", "I bought some groceries.", "Store it in the cabinet."], 0,
      "Câu hỏi phủ định → 'Only in the afternoon' (có mở, chỉ buổi chiều). (C) bẫy 'store' (động từ: cất giữ)."],
    ["Let's review the budget before the meeting.", ["That's a good idea.", "It was over budget.", "I'll meet you there."], 0,
      "Lời đề nghị 'Let's...' → đồng ý: 'That's a good idea'."],
    ["Have you finished the sales report yet?", ["The sale ends tomorrow.", "I'm still waiting for some figures.", "Yes, it was reported."], 1,
      "Trả lời gián tiếp: 'Tôi vẫn đang chờ số liệu' → ngụ ý chưa xong. (A) bẫy 'sale'; (C) bẫy 'report'."],
    ["Where should I submit my travel expenses?", ["Didn't you get the new form?", "It was an expensive trip.", "Next Tuesday."], 0,
      "Trả lời bằng câu hỏi ngược lại – dạng phổ biến từ 2019: 'Bạn chưa nhận mẫu đơn mới à?' (ngụ ý quy trình đã thay đổi)."],
    ["Why don't we hold the training session online?", ["Some staff don't have reliable Internet access.", "It was held last week.", "On the second floor."], 0,
      "'Why don't we...?' là lời đề nghị; câu trả lời đưa lý do phản đối hợp lý."],
    ["What time does the bank close today?", ["At 5 P.M.", "Down the street.", "I need to open an account."], 0,
      "'What time' → giờ cụ thể."],
    ["You've met our new director, haven't you?", ["Yes, at the conference last month.", "The meeting is at ten.", "Direct flights only."], 0,
      "Câu hỏi đuôi → xác nhận: 'Yes, at the conference last month'. (C) bẫy âm 'director – direct'."]
  ];
  P2.forEach((x, i) => window.BANK.push({
    id: "p2-" + (i + 1), part: 2,
    script: [{ s: "M", t: x[0] }],
    questions: [{ q: x[0], o: x[1], a: x[2], e: x[3], audioOptions: true, hideText: true }]
  }));
})();

/* ============================ PART 3 ============================ */
window.BANK.push(
  {
    id: "p3-1", part: 3,
    script: [
      { s: "W", t: "Hi, I'm calling about the apartment for rent on Pine Street. Is it still available?" },
      { s: "M", t: "Yes, it is. It's a two-bedroom unit on the third floor, and the rent is twelve hundred dollars a month." },
      { s: "W", t: "That sounds good. Does the building have parking?" },
      { s: "M", t: "There's a parking garage underneath, but it costs an extra fifty dollars a month. Would you like to come and see the apartment this weekend?" },
      { s: "W", t: "Saturday morning would be perfect." }
    ],
    questions: [
      { q: "Why is the woman calling?", o: ["To report a problem", "To ask about an apartment", "To pay her rent", "To cancel an appointment"], a: 1, e: "'I'm calling about the apartment for rent' → hỏi về căn hộ." },
      { q: "What does the man say about parking?", o: ["It is free for tenants.", "It requires an additional fee.", "It is located across the street.", "It is currently full."], a: 1, e: "'it costs an extra fifty dollars a month' → mất thêm phí." },
      { q: "What will the woman most likely do on Saturday?", o: ["Move into the apartment", "Sign a contract", "View the apartment", "Pay a deposit"], a: 2, e: "Người đàn ông mời đến xem căn hộ cuối tuần, cô ấy chọn sáng thứ Bảy → xem căn hộ." }
    ]
  },
  {
    id: "p3-2", part: 3,
    script: [
      { s: "M", t: "Sandra, have you seen the figures for the new product launch? Sales are much lower than we expected." },
      { s: "W", t: "I saw that. I think the problem is that our advertising campaign started too late. Many customers didn't even know the product was available." },
      { s: "M", t: "You may be right. What do you suggest?" },
      { s: "W", t: "Let's increase our social media advertising this month. I can prepare a proposal and send it to the marketing director by Thursday." }
    ],
    questions: [
      { q: "What problem are the speakers discussing?", o: ["A product is defective.", "Sales are disappointing.", "A shipment is late.", "A budget was cut."], a: 1, e: "'Sales are much lower than we expected' → doanh số đáng thất vọng." },
      { q: "According to the woman, what caused the problem?", o: ["High prices", "Poor product quality", "A late advertising campaign", "A shortage of staff"], a: 2, e: "'our advertising campaign started too late'." },
      { q: "What does the woman offer to do?", o: ["Contact customers directly", "Prepare a proposal", "Lower the price", "Hire a consultant"], a: 1, e: "'I can prepare a proposal and send it to the marketing director'." }
    ]

  <script>
/* TOEIC Prep – logic ứng dụng (vanilla JS, không cần build) */
(function () {
  "use strict";

  const BANK = window.BANK || [];
  const $app = document.getElementById("app");
  const LETTERS = ["A", "B", "C", "D"];

  const PARTS = {
    1: { name: "Part 1 – Mô tả tranh", skill: "L", instr: "Nghe 4 câu mô tả. Chọn câu mô tả đúng nhất bức tranh." },
    2: { name: "Part 2 – Hỏi – Đáp", skill: "L", instr: "Nghe một câu hỏi/câu nói và 3 câu trả lời. Chọn câu trả lời phù hợp nhất." },
    3: { name: "Part 3 – Hội thoại", skill: "L", instr: "Nghe đoạn hội thoại và trả lời 3 câu hỏi." },
    4: { name: "Part 4 – Bài nói ngắn", skill: "L", instr: "Nghe bài nói ngắn và trả lời 3 câu hỏi." },
    5: { name: "Part 5 – Hoàn thành câu", skill: "R", instr: "Chọn từ/cụm từ phù hợp nhất để hoàn thành câu." },
    6: { name: "Part 6 – Hoàn thành đoạn văn", skill: "R", instr: "Chọn đáp án phù hợp nhất cho mỗi chỗ trống trong đoạn văn." },
    7: { name: "Part 7 – Đọc hiểu", skill: "R", instr: "Đọc văn bản và trả lời các câu hỏi." }
  };

  /* ---------------- Storage ---------------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("toeic:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("toeic:" + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };
  const getWrong = () => store.get("wrong", []);
  function updateWrong(results) {
    const set = new Set(getWrong());
    results.forEach(r => { if (r.correct) set.delete(r.key); else if (r.answered) set.add(r.key); });
    store.set("wrong", [...set]);
    refreshBadge();
  }
  function refreshBadge() { document.getElementById("wrongCount").textContent = getWrong().length; }

  /* ---------------- Helpers ---------------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmtTime = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  const countQ = groups => groups.reduce((n, g) => n + g.questions.length, 0);
  const byPart = p => BANK.filter(g => g.part === p);
  const qKey = (g, i) => g.id + "#" + (g.questions[i] && g.questions[i]._orig !== undefined ? g.questions[i]._orig : i);

  /* ---------------- Text-to-speech ---------------- */
  const tts = {
    rate: store.get("rate", 0.9),
    voices: [],
    load() {
      if (!("speechSynthesis" in window)) return;
      const pick = () => { this.voices = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang)); };
      pick();
      speechSynthesis.onvoiceschanged = pick;
    },
    voiceFor(s) {
      const v = this.voices;
      if (!v.length) return null;
      const female = /female|zira|samantha|aria|jenny|susan|victoria|karen|moira|tessa|serena|libby|sonia|hazel|google us english/i;
      const male = /male|david|mark|guy|daniel|alex|fred|george|ryan|tom|google uk english male/i;
      const us = v.filter(x => /en[-_]US/i.test(x.lang));
      const pool = us.length ? us : v;
      if (s === "W") return pool.find(x => female.test(x.name) && !/\bmale\b/i.test(x.name)) || pool[0];
      if (s === "M") return pool.find(x => male.test(x.name) && !/female/i.test(x.name)) || pool[1] || pool[0];
      return v.find(x => /en[-_]GB|en[-_]AU/i.test(x.lang)) || pool[0];
    },
    play(lines, onEnd) {
      if (!("speechSynthesis" in window)) { alert("Trình duyệt không hỗ trợ đọc giọng nói. Hãy dùng Chrome/Edge/Safari bản mới."); return; }
      speechSynthesis.cancel();
      lines.forEach((ln, idx) => {
        const u = new SpeechSynthesisUtterance(ln.t);
        u.lang = "en-US"; u.rate = this.rate;
        const vc = this.voiceFor(ln.s); if (vc) u.voice = vc;
        if (ln.s === "W" && (!vc || vc === this.voiceFor("M"))) u.pitch = 1.3;
        if (ln.s === "M" && (!vc || vc === this.voiceFor("W"))) u.pitch = 0.8;
        if (idx === lines.length - 1 && onEnd) u.onend = onEnd;
        speechSynthesis.speak(u);
      });
    },
    stop() { if ("speechSynthesis" in window) speechSynthesis.cancel(); }
  };
  tts.load();

  function audioLines(g) {
    const lines = (g.script || []).slice();
    const q = g.questions[0];
    if (q.audioOptions) {
      if (g.part === 2) lines.push({ s: "W", t: "" });
      q.o.forEach((o, i) => lines.push({ s: g.part === 2 ? "W" : "N", t: LETTERS[i] + ". " + o }));
    }
    return lines.filter(l => l.t);
  }

  /* ---------------- State ---------------- */
  let S = null;        // phiên làm bài hiện tại
  let timerId = null;
  const settings = Object.assign({ mode: "practice", parts: [1, 2, 3, 4, 5, 6, 7], limit: 30, shuffle: true, minutes: 0 }, store.get("settings", {}));

  /* ---------------- Router ---------------- */
  document.addEventListener("click", e => {
    const n = e.target.closest("[data-nav]");
    if (!n) return;
    e.preventDefault();
    if (S && !S.finished && !confirm("Bạn đang làm bài. Thoát sẽ mất tiến độ. Tiếp tục?")) return;
    stopSession();
    ({ home: renderHome, wrong: renderWrong, history: renderHistory })[n.dataset.nav]();
  });

  function stopSession() { clearInterval(timerId); tts.stop(); S = null; }

  /* ---------------- HOME ---------------- */
  function renderHome() {
    const totalQ = countQ(BANK);
    const hist = store.get("history", []);
    const best = hist.length ? Math.max(...hist.map(h => Math.round(h.correct / h.total * 100))) : 0;
    $app.innerHTML = `
      <section class="card hero">
        <h1>Ôn thi TOEIC Listening & Reading</h1>
        <p>${totalQ} câu hỏi theo đúng 7 Part của đề thi format mới. Mỗi câu đều có giải thích tiếng Việt.</p>
        <div class="stats" style="margin-top:14px">
          <div class="stat"><b>${totalQ}</b><span>Câu hỏi</span></div>
          <div class="stat"><b>${hist.length}</b><span>Lượt đã làm</span></div>
          <div class="stat"><b>${best}%</b><span>Kết quả cao nhất</span></div>
          <div class="stat"><b>${getWrong().length}</b><span>Câu sai cần ôn</span></div>
        </div>
      </section>

      <section class="card">
        <h2>1. Chọn cách làm bài</h2>
        <div class="modes">
          <button class="mode ${settings.mode === "practice" ? "active" : ""}" data-mode="practice">
            <div class="ico">⚡</div><b>Luyện tập – Chấm ngay</b>
            <span>Nhấn đáp án là biết đúng/sai ngay, kèm giải thích chi tiết nếu sai. Phù hợp để học.</span>
          </button>
          <button class="mode ${settings.mode === "exam" ? "active" : ""}" data-mode="exam">
            <div class="ico">⏱️</div><b>Thi thử – Chấm khi nộp bài</b>
            <span>Làm hết đề có tính giờ, nộp bài mới chấm. Xem điểm ước tính & giải thích từng câu.</span>
          </button>
        </div>
      </section>

      <section class="card">
        <h2>2. Chọn phần thi</h2>
        <div class="row" style="margin-bottom:10px">
          <button class="chip" data-preset="all">Tất cả</button>
          <button class="chip" data-preset="L">Chỉ Listening</button>
          <button class="chip" data-preset="R">Chỉ Reading</button>
          <button class="chip" data-preset="5">Chỉ Part 5</button>
        </div>
        <div class="parts">
          ${Object.keys(PARTS).map(p => `
            <label class="part-opt">
              <input type="checkbox" name="part" value="${p}" ${settings.parts.includes(+p) ? "checked" : ""}>
              <div><b>${PARTS[p].name}</b><small>${PARTS[p].skill === "L" ? "🎧 Listening" : "📖 Reading"} · ${countQ(byPart(+p))} câu</small></div>
            </label>`).join("")}
        </div>
        <div class="settings">
          <label>Số câu tối đa
            <select id="limit">
              ${[10, 20, 30, 50, 100, 0].map(n => `<option value="${n}" ${settings.limit === n ? "selected" : ""}>${n ? n + " câu" : "Tất cả"}</option>`).join("")}
            </select>
          </label>
          <label>Thời gian (chế độ thi)
            <select id="minutes">
              <option value="0" ${!settings.minutes ? "selected" : ""}>Tự động (≈ chuẩn TOEIC)</option>
              ${[10, 15, 20, 30, 45, 60, 120].map(n => `<option value="${n}" ${settings.minutes === n ? "selected" : ""}>${n} phút</option>`).join("")}
            </select>
          </label>
          <label>Tốc độ đọc (Listening)
            <select id="rate">
              ${[0.75, 0.85, 0.9, 1, 1.1].map(r => `<option value="${r}" ${tts.rate === r ? "selected" : ""}>${r}x</option>`).join("")}
            </select>
          </label>
          <label class="check"><input type="checkbox" id="shuffle" ${settings.shuffle ? "checked" : ""}> Xáo trộn câu hỏi</label>
        </div>
        <div class="row" style="margin-top:18px">
          <button class="btn primary big" id="start">Bắt đầu làm bài →</button>
          <span class="muted small" id="startInfo"></span>
        </div>
      </section>`;

    const info = () => {
      const parts = [...$app.querySelectorAll("input[name=part]:checked")].map(i => +i.value);
      const lim = +$app.querySelector("#limit").value;
      const total = countQ(BANK.filter(g => parts.includes(g.part)));
      $app.querySelector("#startInfo").textContent = parts.length ? `Sẽ làm khoảng ${lim ? Math.min(lim, total) : total} câu.` : "Hãy chọn ít nhất 1 part.";
    };
    info();
    $app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
      settings.mode = b.dataset.mode;
      $app.querySelectorAll("[data-mode]").forEach(x => x.classList.toggle("active", x === b));
    });
    $app.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => {
      const p = b.dataset.preset;
      $app.querySelectorAll("input[name=part]").forEach(i => {
        const part = +i.value;
        i.checked = p === "all" || PARTS[part].skill === p || String(part) === p;
      });
      info();
    });
    $app.querySelectorAll("input[name=part], #limit").forEach(i => i.onchange = info);
    $app.querySelector("#start").onclick = () => {
      settings.parts = [...$app.querySelectorAll("input[name=part]:checked")].map(i => +i.value);
      settings.limit = +$app.querySelector("#limit").value;
      settings.minutes = +$app.querySelector("#minutes").value;
      settings.shuffle = $app.querySelector("#shuffle").checked;
      tts.rate = +$app.querySelector("#rate").value; store.set("rate", tts.rate);
      if (!settings.parts.length) return alert("Hãy chọn ít nhất 1 part.");
      store.set("settings", settings);
      startSession(buildGroups(settings.parts, settings.limit, settings.shuffle), settings.mode);
    };
  }

  function buildGroups(parts, limit, doShuffle) {
    // Chọn nhóm câu theo tỉ lệ đều giữa các part, giữ nguyên thứ tự Part 1 → 7 như đề thật.
    const pools = {};
    parts.forEach(p => { pools[p] = doShuffle ? shuffle(byPart(p)) : byPart(p); });
    const total = countQ(parts.flatMap(p => pools[p]));
    const target = limit ? Math.min(limit, total) : total;
    const picked = {}; parts.forEach(p => picked[p] = []);
    let n = 0, progress = true;
    while (n < target && progress) {
      progress = false;
      for (const p of parts) {
        if (n >= target) break;
        const g = pools[p].shift();
        if (!g) continue;
        picked[p].push(g); n += g.questions.length; progress = true;
      }
    }
    return parts.slice().sort((a, b) => a - b).flatMap(p => picked[p]);
  }

  /* ---------------- SESSION ---------------- */
  // Xáo thứ tự đáp án để vị trí đáp án đúng phân bố đều A/B/C/D.
  // Ký hiệu (A)/(B)... trong lời giải thích được đổi theo cho khớp.
  // Không xáo câu hỏi chọn vị trí chèn câu ([1]..[4]).
  function shuffleOptions(q) {
    if (q.o.every(o => /^\[\d\]$/.test(o))) return q;
    const perm = shuffle(q.o.map((_, i) => i));      // perm[newIdx] = oldIdx
    const newOf = {}; perm.forEach((old, ni) => { newOf[old] = ni; });
    const e = q.e.replace(/\(([A-D])\)/g, (m, L) => {
      const old = LETTERS.indexOf(L);
      return old < q.o.length ? "(" + LETTERS[newOf[old]] + ")" : m;
    });
    return { ...q, o: perm.map(i => q.o[i]), a: newOf[q.a], e };
  }

  function startSession(groups, mode, label) {
    stopSession();
    if (!groups.length) { alert("Không có câu hỏi nào."); return; }
    groups = groups.map(g => ({ ...g, questions: g.questions.map(q => shuffleOptions(q._base || q)).map((q, i) => ({ ...q, _base: g.questions[i]._base || g.questions[i] })) }));
    const flat = [];
    groups.forEach((g, gi) => g.questions.forEach((q, qi) => flat.push({ g, gi, qi, q, key: qKey(g, qi), num: flat.length + 1 })));
    let seconds = 0;
    if (mode === "exam") {
      seconds = settings.minutes ? settings.minutes * 60
        : Math.ceil(flat.reduce((t, f) => t + (PARTS[f.g.part].skill === "L" ? 35 : 45), 0) / 60) * 60; // ≈ 200 câu / 120 phút
    }
    S = { mode, groups, flat, answers: {}, cur: 0, finished: false, seconds, left: seconds, start: Date.now(), label: label || "" };
    if (mode === "exam") {
      timerId = setInterval(() => {
        S.left = S.seconds - (Date.now() - S.start) / 1000;
        const el = document.getElementById("timer");
        if (el) { el.textContent = fmtTime(S.left); el.classList.toggle("low", S.left < 60); }
        if (S.left <= 0) { clearInterval(timerId); alert("Hết giờ! Bài làm sẽ được nộp tự động."); finish(); }
      }, 500);
    }
    renderQuiz();
  }

  function renderQuiz() {
    tts.stop();
    const g = S.groups[S.cur];
    const exam = S.mode === "exam";
    const answeredN = Object.keys(S.answers).length;
    const P = PARTS[g.part];
    const first = S.flat.find(f => f.gi === S.cur).num;
    const revealed = !exam && g.questions.every((_, i) => S.answers[qKey(g, i)] !== undefined);
    const isLast = S.cur === S.groups.length - 1;

    $app.innerHTML = `
      <div class="quizbar">
        <span class="tag ${exam ? "exam" : ""}">${exam ? "⏱️ Thi thử" : "⚡ Luyện tập"}</span>
        <div class="progress small">Đã làm ${answeredN}/${S.flat.length} câu${S.label ? " · " + esc(S.label) : ""}
          <div class="bar"><i style="width:${answeredN / S.flat.length * 100}%"></i></div></div>
        ${exam ? `<span class="timer" id="timer">${fmtTime(S.left)}</span>
                  <button class="btn primary" id="submit">Nộp bài</button>` :
                 `<button class="btn" id="submit">Kết thúc</button>`}
      </div>

      <section class="card">
        <span class="tag">${P.skill === "L" ? "🎧" : "📖"} ${P.name}</span>
        <div class="instr">${P.instr}</div>
        ${g.scene ? `<div class="scene"><div class="icon">${g.scene.icon}</div><div class="desc">${esc(g.scene.desc)}</div></div>` : ""}
        ${P.skill === "L" ? `<div class="audio">
            <button class="btn primary" id="play">▶ Nghe</button>
            <button class="btn ghost" id="stop">■ Dừng</button>
            <span class="muted small">Có thể nghe lại nhiều lần. Phím tắt: <kbd>Space</kbd></span>
          </div>` : ""}
        <div id="transcript"></div>
        ${g.passage ? `<div class="passage">${g.passage}</div>` : ""}
        <div id="qs">${g.questions.map((q, i) => renderQuestion(g, i, first + i)).join("")}</div>
        <div class="navrow">
          <button class="btn" id="prev" ${S.cur === 0 ? "disabled" : ""}>← Trước</button>
          ${isLast ? `<button class="btn primary" id="end">${exam ? "Nộp bài" : "Xem kết quả"}</button>`
                   : `<button class="btn ${revealed ? "primary" : ""}" id="next">Tiếp →</button>`}
        </div>
      </section>

      <section class="card">
        <h2 class="small" style="margin-bottom:8px">Danh sách câu hỏi</h2>
        <div class="palette">${S.flat.map(f => {
          const a = S.answers[f.key];
          let cls = "";
          if (a !== undefined) cls = exam ? "done" : (a === f.q.a ? "ok" : "bad");
          if (f.gi === S.cur) cls += " cur";
          return `<button class="${cls}" data-jump="${f.gi}">${f.num}</button>`;
        }).join("")}</div>
      </section>`;

    renderTranscript();
    const $ = s => $app.querySelector(s);
    $("#submit").onclick = () => finish(true);
    if ($("#prev")) $("#prev").onclick = () => go(S.cur - 1);
    if ($("#next")) $("#next").onclick = () => go(S.cur + 1);
    if ($("#end")) $("#end").onclick = () => finish(true);
    if ($("#play")) $("#play").onclick = () => tts.play(audioLines(g));
    if ($("#stop")) $("#stop").onclick = () => tts.stop();
    $app.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => go(+b.dataset.jump));
    $app.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => choose(g, +b.dataset.q, +b.dataset.opt));
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (P.skill === "L" && !revealed) setTimeout(() => S && S.groups[S.cur] === g && tts.play(audioLines(g)), 350);
  }

  function renderTranscript() {
    const g = S.groups[S.cur];
    const el = document.getElementById("transcript");
    if (!el || !g.script) return;
    const show = S.mode !== "exam" && g.questions.every((_, i) => S.answers[qKey(g, i)] !== undefined);
    el.innerHTML = show && g.script.length ? transcriptHTML(g) : "";
  }
  function transcriptHTML(g) {
    if (!g.script || !g.script.length) return "";
    const who = { M: "Man", W: "Woman", N: "Narrator" };
    return `<div class="transcript"><b class="small">📝 Transcript</b>${g.script.map(l => `<p><b>${who[l.s]}:</b> ${esc(l.t)}</p>`).join("")}</div>`;
  }

  function renderQuestion(g, i, num) {
    const q = g.questions[i];
    const key = qKey(g, i);
    const a = S.answers[key];
    const exam = S.mode === "exam";
    const reveal = !exam && a !== undefined;
    const showText = !q.hideText || reveal;
    const qtext = q.hideText ? (reveal ? esc(q.q) : "<i class='muted'>(Nghe câu hỏi và chọn đáp án)</i>") : esc(q.q);
    const opts = q.o.map((o, j) => {
      let cls = "";
      if (reveal) { if (j === q.a) cls = "correct"; else if (j === a) cls = "wrong"; }
      else if (a === j) cls = "sel";
      const txt = q.audioOptions && !showText ? "" : esc(o);
      return `<button class="opt ${cls}" data-q="${i}" data-opt="${j}" ${reveal ? "disabled" : ""}><span class="L">(${LETTERS[j]})</span><span>${txt}</span></button>`;
    }).join("");
    const exp = reveal ? `<div class="explain ${a === q.a ? "ok" : "bad"}">
        <b>${a === q.a ? "✅ Chính xác!" : `❌ Sai rồi – Đáp án đúng: (${LETTERS[q.a]}) ${esc(q.o[q.a])}`}</b>${esc(q.e)}</div>` : "";
    return `<div class="q"><div class="qtext"><span class="qnum">${num}.</span>${qtext}</div><div class="opts">${opts}</div>${exp}</div>`;
  }

  function choose(g, i, j) {
    const key = qKey(g, i);
    if (S.mode !== "exam" && S.answers[key] !== undefined) return;
    S.answers[key] = j;
    if (S.mode !== "exam") tts.stop();
    const scrollY = window.scrollY;
    renderQuiz();
    window.scrollTo(0, scrollY);
  }

  function go(i) { if (i < 0 || i >= S.groups.length) return; S.cur = i; renderQuiz(); }

  /* ---------------- FINISH / RESULT ---------------- */
  function finish(ask) {
    if (!S || S.finished) return;
    const missing = S.flat.length - Object.keys(S.answers).length;
    if (ask) {
      const msg = S.mode === "exam"
        ? (missing ? `Bạn còn ${missing} câu chưa làm. Vẫn nộp bài?` : "Nộp bài và chấm điểm?")
        : (missing ? `Còn ${missing} câu chưa làm. Kết thúc và xem kết quả?` : null);
      if (msg && !confirm(msg)) return;
    }
    clearInterval(timerId); tts.stop();
    S.finished = true;
    const results = S.flat.map(f => {
      const a = S.answers[f.key];
      return { ...f, user: a, answered: a !== undefined, correct: a === f.q.a };
    });
    updateWrong(results);
    const correct = results.filter(r => r.correct).length;
    const hist = store.get("history", []);
    hist.unshift({ date: Date.now(), mode: S.mode, correct, total: results.length, time: Math.round((Date.now() - S.start) / 1000), parts: [...new Set(S.groups.map(g => g.part))] });
    store.set("history", hist.slice(0, 100));
    renderResult(results);
  }

  function estimate(results, skill) {
    const rs = results.filter(r => PARTS[r.g.part].skill === skill);
    if (!rs.length) return null;
    const ratio = rs.filter(r => r.correct).length / rs.length;
    return Math.min(495, Math.max(5, Math.round((5 + ratio * 490) / 5) * 5));
  }

  function renderResult(results) {
    const total = results.length, correct = results.filter(r => r.correct).length;
    const pct = Math.round(correct / total * 100);
    const L = estimate(results, "L"), R = estimate(results, "R");
    const color = pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--warn)" : "var(--bad)";
    const partRows = [...new Set(results.map(r => r.g.part))].sort().map(p => {
      const rs = results.filter(r => r.g.part === p), c = rs.filter(r => r.correct).length;
      return `<tr><td>${PARTS[p].name}</td><td>${c}/${rs.length}</td><td>${Math.round(c / rs.length * 100)}%</td></tr>`;
    }).join("");
    const elapsed = Math.round((Date.now() - S.start) / 1000);
    const msg = pct >= 85 ? "Xuất sắc! Bạn đã sẵn sàng cho mức điểm cao." : pct >= 65 ? "Khá tốt! Ôn lại các câu sai để tiến bộ thêm." : pct >= 40 ? "Cần cố gắng thêm. Hãy đọc kỹ giải thích bên dưới." : "Đừng nản! Luyện chế độ 'Chấm ngay' để học từng câu.";

    $app.innerHTML = `
      <section class="card">
        <h1>Kết quả ${S.mode === "exam" ? "thi thử" : "luyện tập"}</h1>
        <div class="scorebox">
          <div class="ring" style="background:conic-gradient(${color} ${pct * 3.6}deg, var(--line) 0)"><div>${pct}%</div></div>
          <div>
            <div class="score-big">${correct}<span class="muted" style="font-size:24px">/${total}</span></div>
            <div class="muted">câu đúng · thời gian ${fmtTime(elapsed)}</div>
            <p style="margin:8px 0 0">${msg}</p>
          </div>
        </div>
        ${(L || R) ? `<div class="stats" style="margin-top:16px">
          ${L ? `<div class="stat"><b>${L}</b><span>Listening (ước tính /495)</span></div>` : ""}
          ${R ? `<div class="stat"><b>${R}</b><span>Reading (ước tính /495)</span></div>` : ""}
          ${L && R ? `<div class="stat"><b>${L + R}</b><span>Tổng (ước tính /990)</span></div>` : ""}
        </div><p class="muted small">* Điểm quy đổi chỉ mang tính tham khảo, dựa trên tỉ lệ câu đúng.</p>` : ""}
        <table style="margin-top:10px"><tr><th>Phần</th><th>Đúng</th><th>Tỉ lệ</th></tr>${partRows}</table>
        <div class="row" style="margin-top:16px">
          <button class="btn primary" id="again">Làm lại đề này</button>
          ${results.some(r => !r.correct) ? `<button class="btn" id="retryWrong">Luyện lại câu sai (${results.filter(r => !r.correct).length})</button>` : ""}
          <button class="btn" data-nav="home">Về trang chủ</button>
        </div>
      </section>

      <section class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
          <h2 style="margin:0">Xem lại & giải thích</h2>
          <div class="row">
            <button class="chip" data-filter="all">Tất cả</button>
            <button class="chip" data-filter="bad">Chỉ câu sai/bỏ trống</button>
          </div>
        </div>
        <div id="review"></div>
      </section>`;

    const groupsSnapshot = S.groups, mode = S.mode;
    const renderReview = onlyBad => {
      let html = "", lastG = null;
      results.forEach(r => {
        if (onlyBad && r.correct) return;
        let ctx = "";
        if (r.g !== lastG) {
          if (r.g.passage) ctx += `<details><summary>Xem đoạn văn</summary><div class="passage" style="margin-top:8px">${r.g.passage}</div></details>`;
          if (r.g.scene) ctx += `<div class="muted small">🖼️ ${r.g.scene.icon} ${esc(r.g.scene.desc)}</div>`;
          if (r.g.script && r.g.script.length) ctx += `<details><summary>Xem transcript</summary>${transcriptHTML(r.g)}</details>`;
          lastG = r.g;
        }
        const cls = r.correct ? "ok" : r.answered ? "bad" : "skip";
        html += `<div class="review-item ${cls}">
          <div class="small muted">${PARTS[r.g.part].name}</div>${ctx}
          <div class="qtext" style="margin-top:6px"><span class="qnum">${r.num}.</span>${esc(r.q.q)}</div>
          <div class="opts">${r.q.o.map((o, j) => `<div class="opt ${j === r.q.a ? "correct" : j === r.user ? "wrong" : ""}"><span class="L">(${LETTERS[j]})</span><span>${esc(o)}${j === r.user ? " &nbsp;← <i>bạn chọn</i>" : ""}</span></div>`).join("")}</div>
          <div class="explain ${r.correct ? "ok" : "bad"}"><b>${r.correct ? "✅ Đúng" : r.answered ? `❌ Sai – Đáp án: (${LETTERS[r.q.a]})` : `⚠️ Chưa trả lời – Đáp án: (${LETTERS[r.q.a]})`}</b>${esc(r.q.e)}</div>
        </div>`;
      });
      document.getElementById("review").innerHTML = html || `<div class="empty">🎉 Không có câu sai nào!</div>`;
    };
    renderReview(mode === "exam" ? false : true);
    $app.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => renderReview(b.dataset.filter === "bad"));
    $app.querySelector("#again").onclick = () => startSession(groupsSnapshot, mode);
    const rw = $app.querySelector("#retryWrong");
    if (rw) rw.onclick = () => startSession(groupsFromKeys(results.filter(r => !r.correct).map(r => r.key)), "practice", "Luyện câu sai");
    window.scrollTo({ top: 0 });
  }

  // Tạo các nhóm câu hỏi con từ danh sách key (chỉ giữ những câu cần ôn, vẫn kèm đoạn văn/audio).
  // _orig giữ chỉ số gốc để key (dùng cho danh sách câu sai) vẫn chính xác.
  function groupsFromKeys(keys) {
    const want = {};
    keys.forEach(k => { const [gid, i] = k.split("#"); (want[gid] = want[gid] || []).push(+i); });
    return BANK.filter(g => want[g.id]).sort((a, b) => a.part - b.part).map(g => ({
      ...g,
      questions: [...new Set(want[g.id])].filter(i => g.questions[i]).sort((a, b) => a - b)
        .map(i => ({ ...g.questions[i], _orig: i }))
    })).filter(g => g.questions.length);
  }

  /* ---------------- WRONG LIST ---------------- */
  function renderWrong() {
    const keys = getWrong();
    $app.innerHTML = `<section class="card">
      <h1>Câu sai cần ôn</h1>
      <p class="muted">Những câu bạn làm sai sẽ được lưu ở đây. Làm đúng lại thì câu đó sẽ tự động được xóa khỏi danh sách.</p>
      ${keys.length ? `<div class="row"><button class="btn primary big" id="go">Luyện ${keys.length} câu sai (chấm ngay)</button>
        <button class="btn" id="goExam">Thi lại dạng đề</button>
        <button class="btn ghost" id="clear">Xóa danh sách</button></div>`
        : `<div class="empty">Chưa có câu sai nào. Hãy làm bài để hệ thống ghi nhận nhé!</div>`}
    </section>`;
    if (!keys.length) return;
    $app.querySelector("#go").onclick = () => startSession(groupsFromKeys(keys), "practice", "Ôn câu sai");
    $app.querySelector("#goExam").onclick = () => startSession(groupsFromKeys(keys), "exam", "Thi lại câu sai");
    $app.querySelector("#clear").onclick = () => { if (confirm("Xóa toàn bộ danh sách câu sai?")) { store.set("wrong", []); refreshBadge(); renderWrong(); } };
  }

  /* ---------------- HISTORY ---------------- */
  function renderHistory() {
    const h = store.get("history", []);
    $app.innerHTML = `<section class="card">
      <h1>Lịch sử làm bài</h1>
      ${h.length ? `<table><tr><th>Thời điểm</th><th>Chế độ</th><th>Part</th><th>Kết quả</th><th>Thời gian</th></tr>
        ${h.map(x => `<tr><td>${new Date(x.date).toLocaleString("vi-VN")}</td><td>${x.mode === "exam" ? "⏱️ Thi thử" : "⚡ Luyện tập"}</td>
          <td>${(x.parts || []).join(", ")}</td><td><b>${x.correct}/${x.total}</b> (${Math.round(x.correct / x.total * 100)}%)</td><td>${fmtTime(x.time)}</td></tr>`).join("")}
        </table><div class="row" style="margin-top:14px"><button class="btn ghost" id="clr">Xóa lịch sử</button></div>`
        : `<div class="empty">Chưa có lượt làm bài nào.</div>`}
    </section>`;
    const c = $app.querySelector("#clr");
    if (c) c.onclick = () => { if (confirm("Xóa lịch sử?")) { store.set("history", []); renderHistory(); } };
  }

  /* ---------------- Keyboard ---------------- */
  document.addEventListener("keydown", e => {
    if (!S || S.finished || /input|select|textarea/i.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") go(S.cur + 1);
    else if (e.key === "ArrowLeft") go(S.cur - 1);
    else if (e.key === " " && PARTS[S.groups[S.cur].part].skill === "L") { e.preventDefault(); tts.play(audioLines(S.groups[S.cur])); }
    else if (/^[a-d1-4]$/i.test(e.key) && S.groups[S.cur].questions.length === 1) {
      const j = /\d/.test(e.key) ? +e.key - 1 : e.key.toLowerCase().charCodeAt(0) - 97;
      if (j < S.groups[S.cur].questions[0].o.length) choose(S.groups[S.cur], 0, j);
    }
  });

  refreshBadge();
  renderHome();
})();
</script>
</body>
</html>
